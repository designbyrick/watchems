name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    environment: production

    env:
      # Real secrets are not needed for a build check — stubs prevent
      # "missing env var" crashes in next.config.mjs and lib/ imports.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: sk_test_stub
      DATABASE_URL: postgresql://stub:stub@stub/stub
      GEMINI_API_KEY: stub
      RESEND_API_KEY: stub
      R2_ACCOUNT_ID: stub
      R2_ACCESS_KEY_ID: stub
      R2_SECRET_ACCESS_KEY: stub
      R2_BUCKET_NAME: stub
      R2_PUBLIC_URL: https://stub.r2.dev
      UPSTASH_REDIS_REST_URL: https://stub.upstash.io
      UPSTASH_REDIS_REST_TOKEN: stub
      NEXT_PUBLIC_GA_ID: G-STUB
      ADMIN_USER_IDS: stub
      BREVO_API_KEY: stub
      BREVO_LIST_ID: stub
      RESEND_FROM_EMAIL: noreply@stub.com
      GOOGLE_SERVICE_ACCOUNT_JSON: '{}'
      VERCEL_CRON_SECRET: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
