name: Image health ping

# Vercel Hobby only allows daily crons, so GitHub Actions calls the
# image health check every 15 minutes. The route itself sends the email.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron/image-health
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            # Skip instead of failing so GitHub doesn't email a failure every 15 min before setup
            echo "::warning::CRON_SECRET repository secret is not set — skipping health check"
            exit 0
          fi
          status=$(curl -s -o response.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://watchems.com/api/cron/image-health)
          cat response.json; echo
          echo "HTTP $status"
          [ "$status" = "200" ]
