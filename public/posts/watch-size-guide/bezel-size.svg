<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="1536" height="864" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1536" height="864" fill="#FFFFFF"/>
  <line x1="768" y1="60" x2="768" y2="804" stroke="#E4E4E2" stroke-width="3"/>

  <!-- Thin bezel: same case, big dial -->
  <text x="384" y="130" font-size="72" font-weight="600" fill="#161616" text-anchor="middle">Thin bezel</text>
  <circle cx="384" cy="470" r="240" fill="#D2D2CF" stroke="#5A5A58" stroke-width="5"/>
  <circle cx="384" cy="470" r="222" fill="#FFFFFF" stroke="#D2D2CF" stroke-width="2"/>
  <g stroke="#767674" stroke-width="7" stroke-linecap="round">
    <line x1="384" y1="268" x2="384" y2="300"/><line x1="384" y1="640" x2="384" y2="672"/>
    
  </g>
  <text x="384" y="486" font-size="52" font-weight="600" fill="#16A34A" text-anchor="middle">wears bigger</text>

  <!-- Wide bezel: same case, small dial -->
  <text x="1152" y="130" font-size="72" font-weight="600" fill="#161616" text-anchor="middle">Wide bezel</text>
  <circle cx="1152" cy="470" r="240" fill="#161616" stroke="#5A5A58" stroke-width="5"/>
  <circle cx="1152" cy="470" r="160" fill="#FFFFFF" stroke="#D2D2CF" stroke-width="2"/>
  <g stroke="#767674" stroke-width="7" stroke-linecap="round">
    <line x1="1152" y1="328" x2="1152" y2="356"/><line x1="1152" y1="584" x2="1152" y2="612"/>
    
  </g>
  <text x="1152" y="486" font-size="44" font-weight="600" fill="#C2410C" text-anchor="middle">wears smaller</text>
</svg>
